name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tạo role và DB (tickee_migrator, tickee_app)
        run: psql -v ON_ERROR_STOP=1 -f docker/postgres/init.sql

      - name: Build + typecheck
        run: pnpm turbo build typecheck

      - name: dependency-cruiser (AD-10)
        run: pnpm turbo lint:deps

      - name: Migrate (APP_ROLE=migrate)
        run: node apps/api/dist/main.js
        env:
          APP_ROLE: migrate
          MIGRATION_DATABASE_URL: postgresql://tickee_migrator:tickee_migrator@localhost:5432/tickee

      - name: Vitest (Postgres 18 thật)
        run: pnpm turbo test
        env:
          DATABASE_URL: postgresql://tickee_app:tickee_app@localhost:5432/tickee_test
          MIGRATION_DATABASE_URL: postgresql://tickee_migrator:tickee_migrator@localhost:5432/tickee_test

      - name: Build image api
        run: docker build -f apps/api/Dockerfile -t tickee-api:${{ github.sha }} .

      - name: Chạy image (APP_ROLE=migrate)
        run: >-
          docker run --rm --network host
          -e APP_ROLE=migrate
          -e MIGRATION_DATABASE_URL=postgresql://tickee_migrator:tickee_migrator@localhost:5432/tickee
          tickee-api:${{ github.sha }}
