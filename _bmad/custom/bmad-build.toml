# Retro Epic 5 (G3, E5-6): mục kiểm thủ công chạy đầu tiên, trước khi đặt `done`.
on_complete = '''
### Kiểm thủ công chưa làm

Retro Epic 5 (G3, E5-6): 5/9 spec có mục kiểm thủ công không làm mà story vẫn `done`, và không mục nào thành mục hoãn.
Chạy mục này đầu tiên, trước hai mục dưới. Đây là lần dừng chờ người dùng duy nhất được phép trước mục sprint-status.

1. Kiểm nhánh như bước 1 của mục sprint-status. Nhánh là `main` (hoặc rỗng) thì không sửa file, không commit, báo người
   dùng, rồi bỏ qua mục này.
2. Đọc `{spec_file}`, lấy mọi mục kiểm thủ công: dòng trong `## Verification` › "Manual checks", và mọi AC ghi "kiểm
   thủ công", "kiểm tay", "thử tay", "điện thoại thật" hay "thiết bị thật". Đối chiếu với `## Implementation Notes`,
   kết quả review và những gì đã chạy trong lượt này. Mục chưa có bằng chứng đã kiểm (ghi "Chưa làm", "chưa thử tay",
   hoặc không nhắc tới) là mục chưa làm. Không có mục chưa làm thì sang mục kế tiếp.
3. Có mục chưa làm: hỏi người dùng đúng một câu, liệt kê từng mục (trích nguyên văn) với hai lựa chọn:
   - **Kiểm ngay**: người dùng kiểm, hoặc agent kiểm khi làm được trên stack local (vd. Playwright, trình duyệt).
   - **Hoãn**: kèm story hay action item nhận; agent đề xuất đích.
   "Chấp nhận không kiểm" chỉ khi người dùng nói rõ. Dừng chờ trả lời; chưa chạy hai mục dưới.
4. Theo trả lời, với mỗi mục (`<ngày>` dạng `dd/mm/yyyy`):
   - Kiểm ngay, đạt: thêm vào `## Implementation Notes` của spec dòng
     `- Kiểm thủ công (<ngày>): <mục> — đạt. <ai kiểm, kiểm thế nào>.`
   - Kiểm ngay, không đạt: không đặt `done` và không chạy hai mục dưới. Báo người dùng; story giữ `review` để sửa.
   - Hoãn hoặc chấp nhận: thêm một mục defer mới vào
     `{project-root}/_bmad-output/implementation-artifacts/deferred-work.md` theo mẫu trong persistent facts
     (`source_spec: {spec_file}`, summary nêu mục kiểm, evidence trích AC hoặc check, `story: <đích>` hoặc
     `story: chấp nhận: <lý do>`), và thêm vào Implementation Notes dòng
     `- Kiểm thủ công hoãn (<ngày>): <mục> → <đích>.`
5. Có file đổi ở bước 4 thì commit riêng trên nhánh hiện tại, chỉ các file đó:
   `git commit --only {spec_file} {project-root}/_bmad-output/implementation-artifacts/deferred-work.md -m "chore: <story_key hoặc id action item> kiểm thủ công"`
   (bỏ `deferred-work.md` khỏi lệnh khi file này không đổi). Không push; báo người dùng một dòng kèm hash commit. Rồi
